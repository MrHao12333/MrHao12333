<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="MrHao - Android Reverse Engineering, Embedded CAN, UE / IL2CPP">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="0.55" stop-color="#0e1729"/>
      <stop offset="1" stop-color="#170f2b"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.45" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="0.8" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.35"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="38" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <circle cx="1040" cy="70" r="150" fill="#22d3ee" opacity="0.10" filter="url(#glow)"/>
  <circle cx="200" cy="280" r="160" fill="#a78bfa" opacity="0.10" filter="url(#glow)"/>
  <circle cx="640" cy="160" r="220" fill="#6366f1" opacity="0.05" filter="url(#glow)"/>

  <!-- CAN waveform motif -->
  <g transform="translate(760 210)" opacity="0.9">
    <path d="M0 30 H40 V0 H80 V30 H120 V60 H160 V30 H200 V0 H240 V30 H280 V60 H320 V30 H360"
          fill="none" stroke="#5eead4" stroke-width="2.5" stroke-linejoin="round" opacity="0.55"/>
    <path d="M0 60 H30 V30 H70 V0 H110 V30 H150 V60 H190 V30 H230 V0 H270 V30 H310 V60 H360"
          fill="none" stroke="#818cf8" stroke-width="2" stroke-linejoin="round" opacity="0.45"/>
  </g>

  <text x="72" y="150" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="84" font-weight="800" letter-spacing="-2" fill="url(#name)">MrHao</text>
  <text x="76" y="196" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#94a3b8" letter-spacing="0.5">Android Reverse Engineering · Embedded / CAN · UE &amp; IL2CPP</text>
  <text x="76" y="232" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="16" fill="#64748b">@MrHao12333</text>

  <rect x="0" y="317" width="1200" height="3" fill="url(#line)"/>
</svg>
